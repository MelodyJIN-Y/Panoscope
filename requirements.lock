# The exact dependency set this project's offline suite is green on.
#
# IMPLEMENTATION.md §8: "Upper-bound every dependency and ship a lockfile." The
# bounds live in pyproject.toml and are what a fresh `pip install` resolves
# within; this file is the other half -- one resolved set, recorded, so a run can
# be reproduced rather than re-resolved.
#
# SCOPE, stated rather than implied. This is `pip freeze` of a clean venv after
# `pip install ".[app,agent,export,dev]"` on CPython 3.12. It is therefore
# specific to that interpreter and platform, and it does NOT cover the `spatial`
# extra, which nothing in this package imports and no test exercises.
#
# CI uses it the way it is honest to: one job installs from this file and runs the
# suite, proving the pinned set works; the version matrix installs from
# pyproject.toml instead, which is what tests that the BOUNDS are right. A lock
# forced across three interpreters would pin versions never resolved on two of
# them.
#
# Regenerate with:
#   python -m venv /tmp/lockenv && /tmp/lockenv/bin/pip install ".[app,agent,export,dev]"
#   /tmp/lockenv/bin/pip freeze --exclude-editable
