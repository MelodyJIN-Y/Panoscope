[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panoscope"
version = "0.1.0"
description = "A human-in-the-loop interpretation layer for bioinformatics results."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"          # panoscope/types/ uses enum.StrEnum (3.11+)
dependencies = [
    "pandas>=2,<4",                 # dev runs 3.0.x; see NOTE below
    "pyarrow>=14,<26",
    "numpy>=1.26,<3",
    "pyyaml>=6",
]

# NOTE on upper bounds. IMPLEMENTATION.md §8 pinned pandas>=2,<3, plotly<7 and an
# unbounded pyarrow. Development actually runs pandas 3.0.5, plotly 7.0.0 and
# pyarrow 25.0.1 with the whole offline suite green, so those bounds would have
# made a clean `pip install` resolve something nobody has tested. Widened to the
# next major instead of removed: an unbounded UI/dataframe pin is the
# reproducibility hazard §8 warns about, a stale one is just a lie.

# Upper bounds on EVERY extra, per §8. Each bound is the next major above a version
# this project has actually run; the exact set lives in requirements.lock. The one
# exception is called out rather than hidden.
[project.optional-dependencies]
app     = ["streamlit>=1.59,<2", "plotly>=5.20,<8"]
agent   = ["anthropic>=0.40,<2", "mcp>=1.2,<3", "python-dotenv>=1,<2"]
export  = ["python-docx>=1.1,<2", "fpdf2>=2.7,<3"]
# NOT STALE -- UNBUILT, and the difference matters. ARCHITECTURE §5.1 makes a
# SpatialData (scverse) .zarr store THE on-disk format for spatial evidence,
# replacing the tidy CSV/parquet layer: Shapes for cells, Points for transcripts,
# table.obsm["X_umap"], and `table.var_names` as the measured set -- which is what
# makes the panel-absence rule structural rather than a file we assemble. §5.1
# puts it "behind a panoscope[spatial] extra with the legacy tidy reader
# retained", which is why these two are declared here.
#
# Nothing imports them because `panoscope/data/spatial.py` -- named in
# IMPLEMENTATION.md §1's target layout -- has not been written. So these bounds
# are the only ones here not read off a working install, and they stay bounded
# because an unbounded pin is the hazard §8 names.
#
# Do not read "no importer" as "drop it". §5.1's sequencing note is explicit that
# the zarr reader comes AFTER the tidy adapter and is validated against it on the
# same study; the tidy adapter exists, so this is owed work, not dead weight.
spatial = ["spatialdata>=0.2,<1", "zarr>=2.17,<4"]
dev     = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.5,<1", "mypy>=1.10,<2"]

[project.scripts]
panoscope = "panoscope.cli:main"

[tool.hatch.build.targets.wheel]
# Everything under panoscope/ ships, which is what keeps panoscope/skills/*/SKILL.md
# and panoscope/assets/*.png alive under a site-packages install. They are read at
# runtime via package-relative paths, so losing them is a silent runtime break.
packages = ["panoscope"]

[tool.hatch.build]
# The study store never ships in the wheel.
exclude = ["studies", "Raw_data_*", "jazzPanda output", "handoff", "context", "tests"]

# --------------------------------------------------------------------------- #
# pytest config lives here, not in pytest.ini. IMPLEMENTATION.md §7 Phase B says
# "delete pytest.ini", and the reason is one setting it carried: `pythonpath = .`
# put the repo root on sys.path for every run, so no local run ever exercised the
# INSTALLED package and every "works because cwd is the repo root" bug stayed
# invisible. That is exactly what the out-of-tree CI job exists to catch, and
# while the setting was here the job was testing something no developer ever ran.
#
# It is gone, and nothing needed it: `tests/` is a package and pytest puts the
# rootdir on sys.path for a rooted test package, so `from tests.conftest import
# ...` still resolves. `panoscope` resolves because it is installed.
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: exercises the network / live PubMed MCP (deselect with -m \"not live\")",
]
