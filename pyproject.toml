[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "panoscope"
version = "0.1.0"
description = "A human-in-the-loop interpretation layer for bioinformatics results."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"          # panoscope/types/ uses enum.StrEnum (3.11+)
dependencies = [
    "pandas>=2,<4",                 # dev runs 3.0.x
    "pyarrow>=14,<26",
    "numpy>=1.26,<3",
    "pyyaml>=6",
]

# Upper bounds on every dependency and extra (IMPLEMENTATION §8): each is the next
# major above a version this project has run; the exact set is requirements.lock.
[project.optional-dependencies]
# streamlit 1.63 is the oldest verified with `width="stretch"`.
app     = ["streamlit>=1.63,<2", "plotly>=5.20,<8"]
agent   = ["anthropic>=0.40,<2", "mcp>=1.2,<3", "python-dotenv>=1,<2"]
export  = ["python-docx>=1.1,<2", "fpdf2>=2.7,<3"]
# BUILD-side only: writing a SpatialData store and scverse interop (ARCHITECTURE
# §5.1). Reading Points needs only pyarrow (panoscope/data/spatial.py).
spatial = ["spatialdata>=0.8,<1", "zarr>=3,<4"]
dev     = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.5,<1", "mypy>=1.10,<2"]

[project.scripts]
panoscope = "panoscope.cli:main"

[tool.hatch.build.targets.wheel]
# Everything under panoscope/ ships, including skills/*/SKILL.md and assets/*.png,
# which are read at runtime via package-relative paths.
packages = ["panoscope"]

[tool.hatch.build]
# The study store never ships in the wheel.
exclude = ["studies", "Raw_data_*", "jazzPanda output", "handoff", "context", "tests"]

# --------------------------------------------------------------------------- #
# No `pythonpath = .`: tests run against the INSTALLED package (pytest still puts
# the rootdir on sys.path for the `tests` package).
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: exercises the network / live PubMed MCP (deselect with -m \"not live\")",
]
