name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2]

jobs:
  test:
    name: Offline grounding tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      # Report every version's result; one red cell must not cancel the others.
      fail-fast: false
      matrix:
        # IMPLEMENTATION.md §8 sets requires-python = ">=3.11". The floor was
        # briefly 3.10; panoscope/types/ uses enum.StrEnum (3.11+), and a
        # (str, Enum) backport renders str(member) differently, which would make
        # record bytes interpreter-dependent. 3.10 also EOLs in October 2026.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # ~568 MB of loose git objects and 51 MB of committed data: a shallow
          # checkout is materially faster and CI never needs the history.
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its declared extras
        # pyproject.toml, not requirements.txt. requirements.txt is 12 unpinned
        # names and installing it meant every run resolved whatever was newest,
        # which is the reproducibility hazard §8 names -- and it never installed
        # the package, so this job passed only because pytest.ini put the repo
        # root on sys.path. That setting is gone.
        #
        # Editable, deliberately: this job tests that the declared BOUNDS resolve
        # and work on three interpreters. The out-of-tree job is where a
        # non-editable install is exercised.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,agent,export,dev]"

      - name: Run offline test suite
        run: pytest -m "not live" -q

  # ---------------------------------------------------------------------------
  # The lockfile, used the one way it is honest to use it. The matrix job above
  # installs from pyproject.toml, which tests that the declared BOUNDS resolve on
  # three interpreters. This job installs the one recorded set, which tests that
  # a run can be REPRODUCED rather than re-resolved. Forcing the lock across the
  # whole matrix would pin versions never resolved on two of those interpreters.
  # ---------------------------------------------------------------------------
  locked:
    name: Pinned dependency set (requirements.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # the interpreter the lock was resolved on
          cache: pip
      - name: Install the pinned set
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Run offline test suite
        run: pytest -m "not live" -q

  # ---------------------------------------------------------------------------
  # §8: "The study store never ships in the wheel -- hatchling exclude plus a CI
  # assert that the wheel is under 5 MB." The exclude is necessary and not
  # sufficient: it is a list of names, and a new directory under panoscope/ ships
  # by default. This is the assert that notices.
  #
  # The margin is real rather than nominal -- the wheel measured 0.91 MB when this
  # job was written, against data/ at 435 MB -- so a failure here means a study
  # tree or a raw object has been pulled into the package, not that the code grew.
  # ---------------------------------------------------------------------------
  wheel:
    name: Wheel builds and stays under 5 MB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist .
      - name: Assert the wheel is under 5 MB and carries no study data
        run: |
          set -euo pipefail
          whl=$(ls dist/*.whl)
          bytes=$(wc -c < "$whl")
          printf 'wheel: %s (%d bytes, %.2f MB)\n' "$whl" "$bytes" "$(echo "$bytes/1048576" | bc -l)"
          if [ "$bytes" -gt 5242880 ]; then
            echo "::error title=Wheel too large::$whl is $bytes bytes, over the 5 MB ceiling (IMPLEMENTATION.md §8). Something under panoscope/ is shipping that should not -- check [tool.hatch.build] exclude."
            exit 1
          fi
          # The ceiling is a proxy; this is the thing it is a proxy FOR. One
          # line, because an indented heredoc inside a YAML block scalar hands
          # Python its own leading spaces.
          python -c "import sys,zipfile; n=zipfile.ZipFile(sys.argv[1]).namelist(); bad=[x for x in n if '/studies/' in x or x.endswith('.Rds')]; print('::error title=Study data in the wheel::'+'; '.join(bad[:10])) if bad else print('no study tree or .Rds in the wheel'); sys.exit(1 if bad else 0)" "$whl"

  # ---------------------------------------------------------------------------
  # DO NOT DELETE THIS JOB WHEN IT IS RED. IT IS SUPPOSED TO BE RED RIGHT NOW,
  # and the reason is no longer the one this comment used to give.
  #
  # The old reason was "there is no pyproject.toml, so there is nothing to
  # install". That became false when packaging landed, and the comment outlived
  # it -- a job documented as expected-to-fail for a reason that had already been
  # fixed is worse than no job, because nobody rechecks it.
  #
  # MEASURED, not assumed. `pip install .` now works and `import panoscope`
  # resolves to site-packages. Running the suite from outside the repo gives:
  #
  #   with no PANOSCOPE_DATA_ROOT   6 collection errors. layout.resolve_data_root()
  #                                 falls back to parents[2] of layout.py, which
  #                                 under site-packages is site-packages/ -- so it
  #                                 looks for site-packages/data/jazzpanda/... .
  #                                 §8's answer is that the small fixture study
  #                                 ships INSIDE the wheel and the demo is fetched
  #                                 (`panoscope fetch-demo`); neither exists yet.
  #
  #   with PANOSCOPE_DATA_ROOT set  1966 passed, 19 failed, 180 errors across 15
  #                                 test modules. Those are the real "works
  #                                 because cwd is the repo root" bugs this job
  #                                 exists to find. Some are tests that audit
  #                                 SOURCE text through repo-relative paths and
  #                                 cannot meaningfully run against a wheel --
  #                                 those want a skip, not a fix.
  #
  # So it stays non-blocking, with a number attached, and the number is what makes
  # the claim checkable. Fix it by shipping the fixture study in the wheel and
  # making the source-auditing tests skip out-of-tree -- never by deleting the job
  # or by putting the repo root back on sys.path.
  # ---------------------------------------------------------------------------
  out-of-tree:
    name: Out-of-tree install + tests (canary, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          # Deliberately NOT `-e .`: an editable install drops the repo root back
          # onto sys.path via a .pth file, which is exactly what this job exists to
          # do without. Extras included so the UI and agent modules import.
          pip install ".[app,agent,export,dev]"

      - name: Stage the tests outside the repo
        run: |
          mkdir -p "$RUNNER_TEMP/oot"
          cp -R tests "$RUNNER_TEMP/oot/tests"
          # A config with NO `pythonpath`. That one setting is what this job is
          # here to defeat, so the repo's pytest.ini must not be used.
          cat > "$RUNNER_TEMP/oot/pytest.ini" <<'EOF'
          [pytest]
          markers =
              live: exercises the network / live PubMed MCP (deselect with -m "not live")
          EOF

      - name: Run the suite with the repo moved aside
        # cwd is runner.temp, not the workspace, so this step still runs while
        # the checkout is renamed out from under it.
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          trap 'mv "$RUNNER_TEMP/repo-moved-aside" "$GITHUB_WORKSPACE" 2>/dev/null || true' EXIT
          mv "$GITHUB_WORKSPACE" "$RUNNER_TEMP/repo-moved-aside"
          cd "$RUNNER_TEMP/oot"
          python -c 'import sys; print("\n".join(sys.path))'
          python -m pytest -c pytest.ini tests -m "not live" -q
